<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Concept 2: Stack — fanned, color-banded cards representing isolated profiles -->
  <defs>
    <linearGradient id="c2-bg" x1="140" y1="120" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2C38"/>
      <stop offset="1" stop-color="#17181F"/>
    </linearGradient>
    <linearGradient id="c2-teal" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3C6"/>
      <stop offset="1" stop-color="#0E9C93"/>
    </linearGradient>
    <linearGradient id="c2-amber" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC259"/>
      <stop offset="1" stop-color="#F0972A"/>
    </linearGradient>
    <linearGradient id="c2-violet" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BF2"/>
      <stop offset="1" stop-color="#5B3DDB"/>
    </linearGradient>
    <linearGradient id="c2-sheen" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="c2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
    <clipPath id="c2-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="114" width="824" height="824" rx="185" ry="185" fill="#000000" opacity="0.30" filter="url(#c2-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#c2-bg)"/>

  <g clip-path="url(#c2-clip)">
    <!-- back-left card -->
    <g transform="translate(422,532) rotate(-15)">
      <rect x="-198" y="-258" width="396" height="516" rx="84" fill="url(#c2-teal)"/>
    </g>
    <!-- back-right card -->
    <g transform="translate(602,540) rotate(15)">
      <rect x="-198" y="-258" width="396" height="516" rx="84" fill="url(#c2-amber)"/>
    </g>
    <!-- front card -->
    <g transform="translate(512,500)">
      <rect x="-206" y="-268" width="412" height="536" rx="88" fill="url(#c2-violet)"/>
      <rect x="-206" y="-268" width="412" height="536" rx="88" fill="url(#c2-sheen)"/>
      <circle cx="-108" cy="-140" r="52" fill="#FFFFFF" fill-opacity="0.92"/>
      <rect x="-108" y="98" width="216" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.55"/>
      <rect x="-108" y="152" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
