<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Browser app icon (chosen mark: "Stack") — fanned, color-banded cards representing isolated profiles -->
  <defs>
    <linearGradient id="bg" x1="140" y1="120" x2="900" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2C38"/>
      <stop offset="1" stop-color="#17181F"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3C6"/>
      <stop offset="1" stop-color="#0E9C93"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC259"/>
      <stop offset="1" stop-color="#F0972A"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="-280" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BF2"/>
      <stop offset="1" stop-color="#5B3DDB"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="-284" x2="0" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
    <clipPath id="clip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="114" width="824" height="824" rx="185" ry="185" fill="#000000" opacity="0.30" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- back-left card -->
    <g transform="translate(430,528) rotate(-13)">
      <rect x="-198" y="-258" width="396" height="516" rx="84" fill="url(#teal)"/>
    </g>
    <!-- back-right card -->
    <g transform="translate(596,536) rotate(13)">
      <rect x="-198" y="-258" width="396" height="516" rx="84" fill="url(#amber)"/>
    </g>
    <!-- front card -->
    <g transform="translate(512,500)">
      <rect x="-206" y="-268" width="412" height="536" rx="92" fill="url(#violet)"/>
      <rect x="-206" y="-268" width="412" height="536" rx="92" fill="url(#sheen)"/>
      <circle cx="-114" cy="-148" r="58" fill="#FFFFFF" fill-opacity="0.94"/>
      <rect x="-114" y="94" width="228" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.55"/>
      <rect x="-114" y="146" width="158" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
