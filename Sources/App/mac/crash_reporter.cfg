# CEF/Crashpad crash reporting config (browser-6iv).
#
# CEF looks for this file, by this exact name, in the top-level app bundle's
# Contents/Resources directory on macOS -- its mere presence is what turns
# Crashpad on (CefCrashReportingEnabled() returns false without it, which is
# the state this app shipped in until browser-6iv). Format and every
# supported key are documented in
# third_party/cef/*/include/cef_crash_util.h; read that before editing.
#
# Dumps are LOCAL ONLY: ServerURL is deliberately empty, so reports are
# written to disk -- into <root_cache_path>/pending, i.e. this app's
# --profiles-root, default ~/Library/Application Support/Browser/Profiles --
# and never uploaded anywhere. `./scripts/crash-dumps.sh` finds them. A crash dump contains process memory, which
# for a browser means page contents -- see
# docs/ai-tasks/crash-reporting-notes.md for what a dump holds, how to read
# one, and what would have to change to enable upload.

[Config]

# Empty (not absent) is meaningful on macOS: cef_crash_util.h documents that
# empty values are filled in from Info.plist, where absent keys would instead
# hardcode "cef" and the CEF version. Observed result on a real launch:
# product=Browser_Mac (the app bundle's CFBundleName plus Chromium's usual
# _Mac suffix) and version=150.0.14.0 (the *CEF framework's*
# CFBundleShortVersionString, not the app's 0.1.0). Left empty deliberately:
# the exact build a dump came from is identified by the Browser binary's
# module UUID in the dump itself, which can't drift the way a hand-maintained
# version string here would.
ProductName=
ProductVersion=

# macOS only, browser process only (Crashpad always suppresses this for
# renderer/GPU/network helpers). True keeps the behaviour Brady already has
# today: a browser-process crash still reaches the system crash reporter, so
# the familiar "Browser quit unexpectedly" dialog and the symbolicated
# ~/Library/Logs/DiagnosticReports/Browser-*.ips report both keep appearing --
# on top of, not instead of, Crashpad's own minidump. Without this, enabling
# Crashpad would take the .ips reports away, which for a one-user app would
# be a net loss of signal rather than a gain.
BrowserCrashForwardingEnabled=true

# Empty = store on disk only, never upload. See the header comment above.
ServerURL=

# Only meaningful once ServerURL is set; harmless and correct-by-default now.
RateLimitEnabled=true
MaxUploadsPerDay=5

# Both are well above CEF's defaults (20 MB / 5 days). Nothing uploads or
# prunes these but the app itself, and the realistic workflow is Brady
# noticing a crash days after it happened, so a dump needs to still be there
# when someone finally goes looking.
MaxDatabaseSizeInMb=256
MaxDatabaseAgeInDays=30
